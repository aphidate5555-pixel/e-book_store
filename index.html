<!doctype html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee8db">
  <title>E-bookshop</title>
  <link rel="icon" type="image/jpeg" href="./logo-ebookshop.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Noto+Sans+Lao:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Serif+Lao:wght@500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js" defer></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
      }
    }
  </script>
  <script type="module" src="./app.js?v=3"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" data-i18n-aria="app.name">
      <img class="brand-logo" src="./logo-ebookshop.jpg" alt="E-bookshop logo">
      <span>
        <b data-i18n="app.name">E-bookshop</b>
        <small data-i18n="app.tagline"></small>
      </span>
    </a>
    <nav>
      <a href="#home" data-i18n="nav.home"></a>
      <a href="#library" data-i18n="nav.library"></a>
    </nav>
    <div class="account">
      <button id="lang-toggle" class="icon-button lang-button" type="button" aria-label="Switch language">LA</button>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="ສະຫຼັບຮູບແບບ">◐</button>
      <button id="orders-open" class="quiet-button" type="button" hidden data-i18n="nav.myOrders"></button>
      <button id="bookmarks-open" class="quiet-button" type="button" hidden data-i18n="reader.bookmarks"></button>
      <button id="cart-open" class="quiet-button cart-button" type="button">
        <span data-i18n="shop.cart"></span>
        <b id="cart-count">0</b>
      </button>
      <button id="auth-open" class="primary-button" type="button" data-i18n="nav.login"></button>
    </div>
  </header>

  <main id="home">
    <section class="hero complete-shelf-hero press-experience" id="shelf-experience">
      <div class="press-site-header">
        <div class="press-wordmark">
          <strong>E-BOOKSHOP</strong>
          <span class="press-divider"></span>
          <span data-i18n="app.tagline"></span>
        </div>
        <div class="press-edition-mark">
          <span id="shelf-scroll-readout">01 — 19</span>
          <span class="press-ready-pill"><i class="ready-dot"></i> <span data-i18n="home.stageSelect"></span></span>
        </div>
      </div>

      <div class="hero-stage shelf-stage-wrap" id="shelf-stage-wrap">
        <canvas id="hero-book" data-i18n-aria="book.coverPreview" tabindex="0"></canvas>

        <button id="shelf-prev" class="shelf-nav-btn prev" type="button" data-i18n-aria="home.prevBook" title="Previous (←)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <button id="shelf-next" class="shelf-nav-btn next" type="button" data-i18n-aria="home.nextBook" title="Next (→)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
        </button>

        <!-- Bottom-left Browse Caption (matches play.mint.gg/complete-shelf) -->
        <div class="browse-caption" id="shelf-active-card">
          <div class="browse-counter-row">
            <span id="shelf-slot-pill" class="shelf-slot-pill">01 — 19</span>
            <span id="hero-book-badge" class="hero-book-badge"></span>
          </div>
          <h1 id="shelf-active-title" class="shelf-active-title"></h1>
          <p id="shelf-active-meta" class="shelf-active-meta"></p>
          <p id="shelf-active-note" class="shelf-active-note"></p>
          <div class="browse-actions">
            <button id="shelf-inspect-toggle" class="inspect-volume-link" type="button">
              <span data-i18n="home.inspectBook"></span>
              <i aria-hidden="true">↗</i>
            </button>
            <button id="hero-open-detail" class="inspect-secondary-link" type="button" data-i18n="book.startReading"></button>
          </div>
        </div>

        <!-- Slide-in Right Inspection Panel (matches play.mint.gg/complete-shelf) -->
        <aside id="inspection-drawer" class="book-details" aria-hidden="true">
          <div class="book-details-top">
            <button type="button" id="inspect-return" class="return-shelf-link">
              <span aria-hidden="true">←</span>
              <span data-i18n="home.returnToShelf"></span>
            </button>
            <span id="inspect-counter" class="inspect-counter">01 — 19</span>
          </div>

          <div class="book-details-body">
            <p id="inspect-edition" class="inspect-edition"></p>
            <h2 id="inspect-title" class="inspect-title"></h2>
            <p id="inspect-author" class="inspect-author"></p>
            <p id="inspect-description" class="inspect-description"></p>
            <blockquote id="inspect-quote" class="inspect-quote"></blockquote>

            <dl class="inspect-specs">
              <div>
                <dt data-i18n="book.category"></dt>
                <dd id="inspect-format">Hardcover · 3D</dd>
              </div>
              <div>
                <dt data-i18n="shop.orderStatus"></dt>
                <dd id="inspect-availability"></dd>
              </div>
            </dl>

            <div class="inspect-cta-row">
              <button type="button" id="inspect-read-btn" class="primary-button" data-i18n="book.startReading"></button>
              <button type="button" id="inspect-detail-btn" class="quiet-button" data-i18n="book.description"></button>
            </div>
          </div>

          <div id="inspection-toolbar" class="focus-controls">
            <span id="stage-caption" class="focus-hint" data-i18n="home.inspectHint"></span>
            <div class="focus-btn-group">
              <button type="button" id="inspect-zoom-in" class="reset-view-btn" data-i18n-aria="home.zoomIn">+</button>
              <button type="button" id="inspect-zoom-out" class="reset-view-btn" data-i18n-aria="home.zoomOut">−</button>
              <button type="button" id="inspect-reset" class="reset-view-btn" data-i18n="home.resetView"></button>
            </div>
          </div>
        </aside>
      </div>

      <!-- Bottom 19-Volume Catalog Ruler -->
      <div class="shelf-scrubber-bar">
        <div id="shelf-markers" class="shelf-markers" role="tablist" aria-label="19 Clothbound Hardcover Position Markers"></div>
        <div class="shelf-ruler-meta">
          <span data-i18n="home.shelfHint"></span>
        </div>
      </div>
      <div id="hero-dock" class="hero-dock" hidden></div>
    </section>

    <section class="library" id="library">
      <div class="section-heading">
        <div>
          <h2 data-i18n="home.popular"></h2>
        </div>
        <span id="book-count" class="muted"></span>
      </div>

      <div class="type-tabs" role="tablist">
        <button type="button" class="type-tab active" data-type-filter="" data-i18n="home.allTypes"></button>
        <button type="button" class="type-tab" data-type-filter="ebook" data-i18n="home.ebooksOnly"></button>
        <button type="button" class="type-tab" data-type-filter="novel" data-i18n="home.novelsOnly"></button>
        <button type="button" class="type-tab" data-type-filter="manga" data-i18n="home.mangaOnly"></button>
        <button type="button" class="type-tab" data-type-filter="wishlist" data-i18n="home.wishlistOnly"></button>
      </div>

      <div class="filters">
        <label class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="search" data-i18n-placeholder="home.searchPlaceholder">
        </label>
        <select id="category" data-i18n-aria="book.category">
          <option value="" data-i18n="home.allCategories"></option>
        </select>
        <select id="sort-select" aria-label="Sort books">
          <option value="popular" data-i18n="home.sortPopular"></option>
          <option value="latest" data-i18n="home.sortLatest"></option>
          <option value="price_asc" data-i18n="home.sortPriceAsc"></option>
          <option value="price_desc" data-i18n="home.sortPriceDesc"></option>
        </select>
      </div>

      <div id="continue-section" class="continue-section" hidden>
        <h2 data-i18n="home.continueReading"></h2>
        <div id="continue-list" class="continue-list"></div>
      </div>

      <div id="book-grid" class="book-grid" aria-live="polite"></div>
      <p id="empty-state" class="empty-state" hidden data-i18n="home.noResults"></p>
    </section>
  </main>

  <footer>
    <span data-i18n="app.name"></span>
    <span data-i18n="footer.note"></span>
  </footer>

  <dialog id="auth-dialog" class="dialog">
    <form id="auth-form" class="dialog-card">
      <button type="button" class="close-button" data-close="auth-dialog" data-i18n-aria="common.close">×</button>
      <h2 id="auth-title"></h2>
      <div class="form-field">
        <label for="identity" data-i18n="auth.emailOrUsername"></label>
        <input id="identity" name="identity" autocomplete="username" required>
      </div>
      <div id="register-fields" hidden>
        <div class="form-field">
          <label for="new-username" data-i18n="auth.username"></label>
          <input id="new-username" name="username" autocomplete="username">
        </div>
        <div class="form-field">
          <label for="new-email" data-i18n="auth.email"></label>
          <input id="new-email" name="email" type="email" autocomplete="email">
        </div>
      </div>
      <div class="form-field">
        <label for="password" data-i18n="auth.password"></label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
      </div>
      <p id="auth-error" class="error-message" role="alert"></p>
      <button class="primary-button full-button" type="submit" data-i18n="nav.login"></button>
      <button class="text-button" type="button" id="auth-switch"></button>
    </form>
  </dialog>

  <dialog id="reader-dialog" class="dialog reader-dialog">
    <div class="reader-shell" data-paper="warm">
      <div class="reader-head">
        <div>
          <h2 id="reader-title"></h2>
        </div>
        <div class="reader-toolbar">
          <div class="paper-modes" role="group" aria-label="Paper theme">
            <button type="button" class="paper-btn active" data-paper-mode="warm" data-i18n="reader.paperWarm"></button>
            <button type="button" class="paper-btn" data-paper-mode="sepia" data-i18n="reader.paperSepia"></button>
            <button type="button" class="paper-btn" data-paper-mode="night" data-i18n="reader.paperNight"></button>
          </div>
          <div class="font-controls" role="group" aria-label="Font size">
            <button type="button" id="font-dec" class="quiet-button compact-btn">A-</button>
            <button type="button" id="font-inc" class="quiet-button compact-btn">A+</button>
          </div>
          <button type="button" class="close-button reader-close" data-close="reader-dialog" data-i18n-aria="common.close">×</button>
        </div>
      </div>
      <div id="flipbook" class="flipbook"></div>
      <div class="reader-progress-track"><div id="reader-progress-bar" class="reader-progress-bar"></div></div>
      <div class="reader-controls">
        <button id="page-prev" class="quiet-button" type="button" data-i18n="reader.previous"></button>
        <span id="page-label"></span>
        <button id="bookmark-toggle" class="quiet-button" type="button" data-i18n="reader.addBookmark"></button>
        <button id="page-next" class="primary-button" type="button" data-i18n="reader.next"></button>
      </div>
    </div>
  </dialog>

  <dialog id="detail-dialog" class="dialog">
    <div class="detail-card">
      <button type="button" class="close-button" data-close="detail-dialog" data-i18n-aria="common.close">×</button>
      <div id="detail-cover" class="detail-cover"></div>
      <div class="detail-copy">
        <div class="detail-badges">
          <span id="detail-type-badge" class="type-badge"></span>
          <span id="detail-category" class="category-pill"></span>
        </div>
        <h2 id="detail-title"></h2>
        <p id="detail-author" class="muted"></p>
        <p id="detail-description"></p>
        <p id="detail-stats" class="muted"></p>
        <p id="detail-price" class="detail-price"></p>
        <div class="detail-actions">
          <button id="read-start" class="primary-button" type="button" data-i18n="book.startReading"></button>
          <button id="add-to-cart" class="primary-button" type="button" data-i18n="shop.addToCart" hidden></button>
          <button id="detail-stage-btn" class="quiet-button" type="button" data-i18n="book.previewOnStage"></button>
          <button id="detail-wishlist-btn" class="icon-button wishlist-detail-btn" type="button" aria-label="Wishlist">♡</button>
        </div>
      </div>
      <div id="detail-gallery" class="detail-gallery"></div>
      <section class="review-area">
        <h3 data-i18n="review.title"></h3>
        <div id="review-list"></div>
        <form id="review-form">
          <label for="rating" data-i18n="review.yourRating"></label>
          <select id="rating">
            <option value="5">5 ★</option>
            <option value="4">4 ★</option>
            <option value="3">3 ★</option>
            <option value="2">2 ★</option>
            <option value="1">1 ★</option>
          </select>
          <textarea id="review-comment" rows="3" data-i18n-placeholder="review.writeComment"></textarea>
          <button class="primary-button" type="submit" data-i18n="review.submit"></button>
        </form>
      </section>
    </div>
  </dialog>

  <dialog id="admin-dialog" class="dialog">
    <form id="admin-form" class="dialog-card admin-card">
      <button type="button" class="close-button" data-close="admin-dialog" data-i18n-aria="common.close">×</button>
      <h2 data-i18n="admin.addBook"></h2>
      <label data-i18n="admin.bookTitle"></label>
      <input name="title" required>
      <label data-i18n="book.author"></label>
      <input name="author" required>
      <label data-i18n="book.description"></label>
      <textarea name="description" rows="3"></textarea>
      <label data-i18n="admin.coverUrl"></label>
      <input name="cover_url" placeholder="/covers/web-craft.svg ຫຼື https://…">
      <label data-i18n="admin.coverColor"></label>
      <input name="cover_color" type="color" value="#266653">
      <label data-i18n="book.category"></label>
      <select id="admin-category" name="category_id"></select>
      <label data-i18n="admin.pagesText"></label>
      <textarea name="pages_text" rows="7" required data-i18n-placeholder="admin.pagesPlaceholder"></textarea>
      <p class="muted" data-i18n="admin.pagesHint"></p>
      <p id="admin-error" class="error-message" role="alert"></p>
      <button class="primary-button" type="submit" data-i18n="common.save"></button>
    </form>
  </dialog>

  <dialog id="product-dialog" class="dialog">
    <form id="product-form" class="dialog-card admin-card">
      <button type="button" class="close-button" data-close="product-dialog" data-i18n-aria="common.close">×</button>
      <h2 data-i18n="shop.addProduct"></h2>
      <label data-i18n="admin.bookTitle"></label>
      <input name="title" required maxlength="200">
      <label data-i18n="book.author"></label>
      <input name="author" required maxlength="120">
      <label data-i18n="book.description"></label>
      <textarea name="description" rows="2"></textarea>
      <label data-i18n="shop.type"></label>
      <select name="product_type">
        <option value="novel" data-i18n="shop.novel"></option>
        <option value="manga" data-i18n="shop.manga"></option>
      </select>
      <label data-i18n="shop.price"></label>
      <input name="price" type="number" min="1" step="1" required>
      <label data-i18n="shop.stock"></label>
      <input name="stock_qty" type="number" min="0" step="1" required>
      <label data-i18n="admin.coverUrl"></label>
      <input name="cover_url" placeholder="/covers/mekong-moon.svg ຫຼື https://…">
      <label data-i18n="shop.gallery"></label>
      <textarea name="image_urls" rows="3" placeholder="/covers/mekong-moon.svg&#10;/covers/luang-prabang.svg"></textarea>
      <label data-i18n="book.category"></label>
      <select id="product-category" name="category_id"></select>
      <p id="product-error" class="error-message" role="alert"></p>
      <button class="primary-button" type="submit" data-i18n="common.save"></button>
    </form>
  </dialog>

  <dialog id="cart-dialog" class="dialog">
    <div class="dialog-card cart-card">
      <button type="button" class="close-button" data-close="cart-dialog" data-i18n-aria="common.close">×</button>
      <h2 data-i18n="shop.checkout"></h2>
      <div id="cart-lines"></div>
      <p id="cart-total" class="cart-total"></p>
      <form id="checkout-form" class="checkout-form">
        <label data-i18n="shop.customerName"></label>
        <input name="customer_name" required maxlength="120">
        <label data-i18n="shop.phone"></label>
        <input name="phone" type="tel" required>
        <label data-i18n="shop.address"></label>
        <textarea name="address" rows="3" required></textarea>
        <p class="muted" data-i18n="shop.paymentNote"></p>
        <button id="checkout-submit" class="primary-button" type="submit" data-i18n="shop.placeOrder"></button>
      </form>
      <p id="checkout-error" class="error-message" role="alert"></p>
    </div>
  </dialog>

  <dialog id="my-orders-dialog" class="dialog">
    <div class="dialog-card cart-card">
      <button type="button" class="close-button" data-close="my-orders-dialog" data-i18n-aria="common.close">×</button>
      <h2 data-i18n="shop.myOrdersTitle"></h2>
      <div id="customer-orders-list" class="orders-list"></div>
    </div>
  </dialog>

  <dialog id="dashboard-dialog" class="dialog dashboard-dialog">
    <section class="dashboard-card">
      <button type="button" class="close-button" data-close="dashboard-dialog" data-i18n-aria="common.close">×</button>
      <h2 data-i18n="shop.dashboard"></h2>
      <div id="dashboard-metrics" class="dashboard-metrics"></div>
      <h3 data-i18n="shop.products"></h3>
      <div id="inventory-list" class="inventory-list"></div>
      <h3 data-i18n="shop.orders"></h3>
      <div id="orders-list" class="orders-list"></div>
      <button id="dashboard-add-product" class="primary-button" type="button" data-i18n="shop.addProduct"></button>
    </section>
  </dialog>

  <dialog id="bookmarks-dialog" class="dialog">
    <div class="dialog-card">
      <button type="button" class="close-button" data-close="bookmarks-dialog" data-i18n-aria="common.close">×</button>
      <h2 data-i18n="reader.bookmarks"></h2>
      <div id="bookmark-list"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
