  <text x="300" y="688" text-anchor="middle" fill="#ccfbf1" font-family="'Noto Sans Lao', sans-serif" font-size="19">ນິຍາຍຮັກ ແລະ ມິດຕະພາບແຫ່ງສາຍນ້ຳລ້ານຊ້າງ</text>
