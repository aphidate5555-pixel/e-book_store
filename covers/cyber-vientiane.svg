<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="600" height="840">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="840" fill="url(#bg6)"/>
  <!-- Cyber Grid &amp; Neon Portal -->
  <circle cx="300" cy="400" r="145" fill="none" stroke="url(#neon)" stroke-width="4"/>
  <circle cx="300" cy="400" r="115" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="12 6"/>
  <circle cx="300" cy="400" r="85" fill="#f472b6" opacity="0.2"/>
  <!-- Skyline Silhouette -->
  <g fill="#090d16" stroke="#22d3ee" stroke-width="1.5">
    <rect x="130" y="430" width="55" height="170"/>
    <rect x="195" y="370" width="65" height="230"/>
    <rect x="270" y="330" width="60" height="270"/>
    <rect x="340" y="385" width="65" height="215"/>
    <rect x="415" y="440" width="55" height="160"/>
  </g>
  <!-- Perspective Grid Floor -->
  <line x1="60" y1="600" x2="540" y2="600" stroke="#f472b6" stroke-width="2"/>
  <line x1="40" y1="645" x2="560" y2="645" stroke="#f472b6" stroke-width="1" opacity="0.6"/>
  <!-- Frame -->
  <rect x="32" y="32" width="536" height="776" fill="none" stroke="url(#neon)" stroke-width="2.5"/>
  <circle cx="490" cy="115" r="40" fill="#22d3ee"/>
  <text x="490" y="122" text-anchor="middle" fill="#090d16" font-family="sans-serif" font-size="18" font-weight="900">MANGA</text>
  <text x="300" y="102" text-anchor="middle" fill="#22d3ee" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="5">SCI-FI CYBERPUNK SERIES</text>
  <text x="300" y="170" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans Lao', sans-serif" font-size="44" font-weight="900">ນະຄອນໄຊເບີ 2099</text>
  <text x="300" y="212" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="20" font-weight="800" letter-spacing="3">NEON VIENTIANE 2099</text>
  <text x="300" y="705" text-anchor="middle" fill="#e2e8f0" font-family="'Noto Sans Lao', sans-serif" font-size="18">ການຕໍ່ສູ້ຂອງແຮັກເກີໜຸ່ມໃນໂລກອະນາຄົດ</text>
  <text x="300" y="752" text-anchor="middle" fill="#22d3ee" font-family="'Noto Sans Lao', sans-serif" font-size="16" font-weight="700" letter-spacing="2">AKIRA &amp; CYBER ART</text>
