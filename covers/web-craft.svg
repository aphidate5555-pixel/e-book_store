  <!-- Outer Editorial Frame -->
  <rect x="34" y="34" width="532" height="772" fill="none" stroke="url(#gold1)" stroke-width="2" opacity="0.65"/>
  <rect x="46" y="46" width="508" height="748" fill="none" stroke="#93c5fd" stroke-width="0.75" opacity="0.35"/>
