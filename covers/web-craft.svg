    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" stroke="#38bdf8" stroke-width="1.5" fill="#38bdf8" fill-opacity="0.15"/>
    <circle cx="0" cy="-105" r="5" fill="#fde68a"/>
    <circle cx="91" cy="-52" r="5" fill="#fde68a"/>
    <circle cx="91" cy="52" r="5" fill="#fde68a"/>
    <circle cx="0" cy="105" r="5" fill="#fde68a"/>
    <circle cx="-91" cy="52" r="5" fill="#fde68a"/>
    <circle cx="-91" cy="-52" r="5" fill="#fde68a"/>
