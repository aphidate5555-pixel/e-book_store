  <text x="300" y="168" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans Lao', sans-serif" font-size="44" font-weight="800">ເລີ່ມຕົ້ນຂຽນເວັບ</text>
  <text x="300" y="212" text-anchor="middle" fill="#fde68a" font-family="Georgia, serif" font-size="22" font-style="italic">HTML5 · CSS3 · Modern ES6 &amp; WebGL</text>
