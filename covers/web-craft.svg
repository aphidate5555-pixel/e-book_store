  <text x="300" y="672" text-anchor="middle" fill="#e2e8f0" font-family="'Noto Sans Lao', sans-serif" font-size="20" font-weight="500">ຄູ່ມືສ້າງເວັບໄຊລະດັບມືອາຊີບ</text>
  <text x="300" y="745" text-anchor="middle" fill="#fde68a" font-family="'Noto Sans Lao', sans-serif" font-size="16" font-weight="700" letter-spacing="2">ທີມຜູ້ຂຽນ A · 3D LIBRARY EDITION</text>
